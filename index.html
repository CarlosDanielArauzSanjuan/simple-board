<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign In </title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer type="module"></script>
</head>
<body>
    <section class="grid-layout">
        <div class="box c1">
            <dialog id="dialog__login">
                <div class="dialog__header">
                    <span id="dialog__login_close">X</span>
                </div>
                <div id="dialog__message" class="dialog__main">
                    
                </div>
                <div class="dialog__footer"></div>
            </dialog>
            <form id="form__login" action="?" method="get">
                <div class="div__title">
                    <div class="caja n1">
                        <img src="../storage/img/Line 1.png" alt="">
                        <h1>CRUD OPERATIONS</h1>
                    </div>
                    <div class="caja n2">
                        <h2>SIGN IN</h2>
                        <p>Enter your credentials to access your account</p>
                    </div>
                </div>
                <div class="div__input">
                    <div class="caja n3">
                            <label>Email</label>
                        
                        <div class="email">
                        <input type="email" name="email" required placeholder="Enter your email" >
                    </div>
                    </div>
                        <div class="caja n4">
                            <label>Password</label>
                        
                        <div class="password">
                            <input type="password" name="password" required placeholder="Enter your password" >
                    </div>
                    </div>
                </div>
                <div class="div__button">
                    <div class="caja n5">
                        <input type="submit" value="SIGN IN">
                    </div>
                    <div class="caja n6">
                        <span>Forgot your password? <a href="#">Reset Password</a></span>
                    </div>
                </div>
                
            </form>
            <div class="caja n7">
                <p>Don't have an account? <a href="views/account.html">Create account</a></p>
            </div>
        </div>
    </section>
</body>
</html>
